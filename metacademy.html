<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metacademy — The Number One Free MYP Math Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#F5FAFF; }
  body { font-family:'Inter',sans-serif; padding:24px; }
  #root { max-width:1000px; margin:0 auto; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = "metacademy-covered";

/* ---- minimal inline icon set (lucide-style) ---- */
const Icon = ({ children, size = 16, color = "currentColor", strokeWidth = 2, style }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
       strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style}>
    {children}
  </svg>
);
const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6" /></Icon>;
const ChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9" /></Icon>;
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12" /></Icon>;
const Flag = (p) => <Icon {...p}><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" /><line x1="4" y1="22" x2="4" y2="3" /></Icon>;
const Home = (p) => <Icon {...p}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></Icon>;
const BookOpen = (p) => <Icon {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></Icon>;
const PenTool = (p) => <Icon {...p}><path d="M12 19l7-7 3 3-7 7-3-3z" /><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18" /><path d="M2 2l7.586 7.586" /><circle cx="11" cy="11" r="2" /></Icon>;
const Info = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></Icon>;
const ArrowLeft = (p) => <Icon {...p}><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></Icon>;

const STRANDS = [
  { id:"number", num:"I", title:"Number", blurb:"Integers, fractions, exponents, percentages, ratio, and sets.",
    topics:[
      {id:"n1", title:"Integers, order of operations, factors & multiples, HCF & LCM"},
      {id:"n2", title:"Fractions and decimals — all four operations, rounding"},
      {id:"n3", title:"Square roots, cube roots, rational and irrational numbers"},
      {id:"n4", title:"Exponent laws and scientific notation", note:"Oxford Unit 1 covers this in depth; Haese spreads it across two chapters."},
      {id:"n5", title:"Percentages, incl. applied: discount, profit/loss, reverse percentage"},
      {id:"n6", title:"Ratio, rate, scale diagrams"},
      {id:"n7", title:"Sets and Venn diagrams", note:"Haese places this at MYP3; Oxford/Pearson usually cover it earlier, at MYP1–2.", flagged:true},
    ]},
  { id:"algebra", num:"II", title:"Algebra", blurb:"Expressions, equations, formulae, and linear graphs.",
    topics:[
      {id:"a1", title:"Algebraic expressions: writing, substituting, simplifying, factorising"},
      {id:"a2", title:"Solving linear equations, incl. repeated unknowns and power equations"},
      {id:"a3", title:"Formulae: finding, substituting, rearranging"},
      {id:"a4", title:"Linear graphs: gradient, intercepts, equation of a line"},
      {id:"a5", title:"Linear systems and inequalities", note:"Only explicit in Oxford's MYP3. In Haese's sequence this typically sits in MYP4 — confirm with your teachers which year covers it at your school.", flagged:true},
    ]},
  { id:"geometry", num:"III", title:"Geometry & Trigonometry", blurb:"Angles, triangles, congruence, area, volume, and transformations.",
    topics:[
      {id:"g1", title:"Angle properties, parallel lines, triangle and polygon angle sums"},
      {id:"g2", title:"Congruence and similarity, incl. enlargement/reduction"},
      {id:"g3", title:"Pythagoras' theorem and its converse", note:"Haese itself flags this as outside the strict MYP1–3 framework, included for DP readiness — confirm placement.", flagged:true},
      {id:"g4", title:"Perimeter, area, circumference, composite figures"},
      {id:"g5", title:"Surface area, volume, and capacity of 3D solids"},
      {id:"g6", title:"Coordinate geometry — Cartesian plane, plotting lines"},
      {id:"g7", title:"Geometric transformations and symmetry", note:"Explicit at MYP3 in Oxford. In Haese this is folded into congruence/similarity, with translations/reflections/rotations usually taught at MYP2.", flagged:true},
      {id:"g8", title:"Time calculations — units, 24-hour time, time zones"},
    ]},
  { id:"stats", num:"IV", title:"Statistics & Probability", blurb:"Data, measures of centre and spread, bivariate data, and probability.",
    topics:[
      {id:"s1", title:"Data collection, grouped data, measures of centre and spread"},
      {id:"s2", title:"Bivariate data, scatter plots, and correlation", note:"Explicit at MYP3 in Oxford — a notable gap in Haese's MYP3 sequence, which centers univariate data instead.", flagged:true},
      {id:"s3", title:"Probability: theoretical, experimental, independent events, two-way tables, Venn diagrams"},
    ]},
];

function useCovered() {
  const [checked, setChecked] = useState(() => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { return {}; }
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(checked)); } catch (e) {}
  }, [checked]);
  const toggle = (id) => setChecked((c) => ({ ...c, [id]: !c[id] }));
  return [checked, toggle];
}

function Site() {
  const [view, setView] = useState({ level: "home", strand: null, topic: null });
  const [checked, toggle] = useCovered();
  const [tab, setTab] = useState("overview");

  const totalTopics = STRANDS.reduce((s, st) => s + st.topics.length, 0);
  const totalDone = Object.values(checked).filter(Boolean).length;

  const goHome = () => setView({ level: "home", strand: null, topic: null });
  const goStrand = (sIdx) => setView({ level: "strand", strand: sIdx, topic: null });
  const goTopic = (sIdx, tIdx) => { setView({ level: "topic", strand: sIdx, topic: tIdx }); setTab("overview"); };

  const strand = view.strand !== null ? STRANDS[view.strand] : null;
  const topic = strand && view.topic !== null ? strand.topics[view.topic] : null;

  return (
    <div className="site-root">
      <div className="site-nav">
        <div className="site-brand" onClick={goHome}>
          <Home size={16} />
          <span>Metacademy</span>
        </div>
        {view.level !== "home" && (
          <div className="site-crumbs">
            <ChevronRight size={12} />
            <span className="site-crumb" onClick={() => goStrand(view.strand)}>{strand.title}</span>
            {topic && <><ChevronRight size={12} /><span>{topic.title.slice(0, 28)}{topic.title.length > 28 ? "…" : ""}</span></>}
          </div>
        )}
        <div className="site-nav-right">{totalDone}/{totalTopics} covered</div>
      </div>

      <div className="site-body">
        {view.level === "home" && (
          <React.Fragment>
            <div className="home-hero">
              <div className="home-kicker">METACADEMY</div>
              <div className="home-title">The Number One Free MYP Math Library</div>
              <p className="home-sub">One place for the MYP3 mathematics curriculum, lesson resources, and student practice — organized by strand and topic.</p>
              <div className="home-progress">
                <div className="home-progress-bar"><div className="home-progress-fill" style={{ width: (totalDone / totalTopics) * 100 + "%" }} /></div>
                <div className="home-progress-label">{totalDone} of {totalTopics} topics covered so far</div>
              </div>
            </div>
            <div className="strand-grid">
              {STRANDS.map((st, i) => {
                const done = st.topics.filter((t) => checked[t.id]).length;
                return (
                  <div className="strand-card" key={st.id} onClick={() => goStrand(i)}>
                    <div className="strand-card-num">{st.num}</div>
                    <div className="strand-card-title">{st.title}</div>
                    <div className="strand-card-blurb">{st.blurb}</div>
                    <div className="strand-card-bar"><div className="strand-card-fill" style={{ width: (done / st.topics.length) * 100 + "%" }} /></div>
                    <div className="strand-card-count">{done}/{st.topics.length} topics</div>
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        )}

        {view.level === "strand" && (
          <React.Fragment>
            <div className="back-link" onClick={goHome}><ArrowLeft size={13} /> All strands</div>
            <div className="topic-header">
              <div className="strand-card-num">{strand.num}</div>
              <div className="topic-header-title">{strand.title}</div>
            </div>
            <div className="topic-list">
              {strand.topics.map((t, ti) => (
                <div className="topic-row" key={t.id} onClick={() => goTopic(view.strand, ti)}>
                  <div className={"topic-check" + (checked[t.id] ? " done" : "")}
                       onClick={(e) => { e.stopPropagation(); toggle(t.id); }}>
                    {checked[t.id] && <Check size={13} color="#fff" strokeWidth={3} />}
                  </div>
                  <div className={"topic-row-title" + (checked[t.id] ? " done" : "")}>{t.title}</div>
                  {t.flagged && <Flag size={13} color="#C9861A" />}
                  <ChevronRight size={15} color="#5C82A0" />
                </div>
              ))}
            </div>
          </React.Fragment>
        )}

        {view.level === "topic" && (
          <React.Fragment>
            <div className="back-link" onClick={() => goStrand(view.strand)}><ArrowLeft size={13} /> {strand.title}</div>
            <div className="topic-header">
              <div className="strand-card-num">{strand.num}.{view.topic + 1}</div>
              <div className="topic-header-title">{topic.title}</div>
              {topic.note && <div className="topic-flagnote"><Info size={14} style={{ flexShrink:0, marginTop:1 }} />{topic.note}</div>}
            </div>

            <div className="tabs">
              <button className={"tab-btn" + (tab === "overview" ? " active" : "")} onClick={() => setTab("overview")}><Info size={14} /> Overview</button>
              <button className={"tab-btn" + (tab === "lessons" ? " active" : "")} onClick={() => setTab("lessons")}><BookOpen size={14} /> Lesson resources</button>
              <button className={"tab-btn" + (tab === "practice" ? " active" : "")} onClick={() => setTab("practice")}><PenTool size={14} /> Practice</button>
            </div>

            {tab === "overview" && (
              <div className="empty-state">
                <div className="empty-state-icon"><Info size={22} /></div>
                Mark this topic covered from the strand list, or come back once lesson resources and practice sets are added below.
              </div>
            )}
            {tab === "lessons" && (
              <div className="empty-state">
                <div className="empty-state-icon"><BookOpen size={22} /></div>
                No lesson resources added yet for this topic.<br />Slides, worksheets, and teacher notes will appear here.
              </div>
            )}
            {tab === "practice" && (
              <div className="empty-state">
                <div className="empty-state-icon"><PenTool size={22} /></div>
                No practice set added yet for this topic.<br />An interactive question set will appear here.
              </div>
            )}
          </React.Fragment>
        )}
      </div>

      <div className="site-footer">Metacademy — free MYP math library · built for MYP3</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Site />);
</script>

<style>
  .site-root {
    --ink:#F5FAFF; --panel:#E9F3FC; --card:#FFFFFF; --card-hover:#F0F8FF;
    --border:#BFDFF5; --text:#08304E; --text-muted:#5C82A0;
    --blue:#0072BC; --blue-soft:#4FA8DE; --amber:#C9861A;
    color:var(--text); background:var(--ink);
    border:1px solid #D8ECFA; border-radius:14px; overflow:hidden;
  }
  .site-nav { display:flex; align-items:center; gap:10px; padding:16px 28px; background:var(--panel); border-bottom:1px solid var(--border); }
  .site-brand { display:flex; align-items:center; gap:8px; font-family:'Fraunces',serif; font-weight:700; font-size:17px; cursor:pointer; letter-spacing:.2px; }
  .site-crumbs { margin-left:6px; display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-muted); }
  .site-crumb { cursor:pointer; } .site-crumb:hover { color:var(--blue); }
  .site-nav-right { margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-muted); }
  .site-body { padding:34px 32px; min-height:520px; }
  .home-hero { text-align:center; padding:10px 10px 32px; }
  .home-kicker { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--blue); margin-bottom:10px; }
  .home-title { font-family:'Fraunces',serif; font-weight:700; font-size:30px; margin:0 auto 10px; max-width:560px; line-height:1.25; }
  .home-sub { color:var(--text-muted); font-size:14px; max-width:480px; margin:0 auto; line-height:1.6; }
  .home-progress { margin:22px auto 0; max-width:320px; }
  .home-progress-bar { height:7px; border-radius:5px; background:var(--border); overflow:hidden; }
  .home-progress-fill { height:100%; background:var(--blue); transition:width .4s; }
  .home-progress-label { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); margin-top:6px; }
  .strand-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; max-width:800px; margin:0 auto; }
  .strand-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; cursor:pointer; transition:border-color .15s, transform .1s; }
  .strand-card:hover { border-color:var(--blue); transform:translateY(-2px); }
  .strand-card-num { font-family:'IBM Plex Mono',monospace; color:var(--blue); font-size:13px; }
  .strand-card-title { font-family:'Fraunces',serif; font-weight:700; font-size:17px; margin:4px 0 6px; }
  .strand-card-blurb { font-size:12.5px; color:var(--text-muted); line-height:1.5; margin-bottom:10px; }
  .strand-card-bar { height:5px; border-radius:4px; background:var(--panel); overflow:hidden; }
  .strand-card-fill { height:100%; background:var(--blue-soft); }
  .strand-card-count { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-muted); margin-top:5px; }
  .topic-list { display:flex; flex-direction:column; gap:9px; max-width:720px; margin:0 auto; }
  .topic-row { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:13px 15px; cursor:pointer; transition:border-color .15s; }
  .topic-row:hover { border-color:var(--blue); }
  .topic-check { width:19px; height:19px; border-radius:5px; border:1.5px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#fff; }
  .topic-check.done { background:var(--blue); border-color:var(--blue); }
  .topic-row-title { font-size:13.5px; flex:1; }
  .topic-row-title.done { color:var(--text-muted); text-decoration:line-through; }
  .topic-header { max-width:720px; margin:0 auto 18px; }
  .topic-header-title { font-family:'Fraunces',serif; font-weight:700; font-size:20px; margin:6px 0 10px; line-height:1.35; }
  .topic-flagnote { display:flex; gap:8px; background:#FFF7E8; border:1px solid #EAD3A0; color:#8A5A0C; font-size:12.5px; padding:10px 12px; border-radius:8px; line-height:1.5; }
  .tabs { display:flex; gap:6px; max-width:720px; margin:0 auto 18px; border-bottom:1px solid var(--border); }
  .tab-btn { display:flex; align-items:center; gap:6px; padding:9px 16px; font-size:13px; font-weight:600; background:none; border:none; cursor:pointer; color:var(--text-muted); font-family:'Inter',sans-serif; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab-btn.active { color:var(--blue); border-bottom-color:var(--blue); }
  .empty-state { max-width:720px; margin:0 auto; text-align:center; padding:50px 20px; background:var(--card); border:1px dashed var(--border); border-radius:12px; color:var(--text-muted); font-size:13px; line-height:1.6; }
  .empty-state-icon { margin-bottom:10px; opacity:.5; }
  .back-link { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); cursor:pointer; max-width:720px; margin:0 auto 14px; }
  .back-link:hover { color:var(--blue); }
  .site-footer { text-align:center; padding:14px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-muted); border-top:1px solid var(--border); background:var(--panel); }
  @media (max-width:640px){ .strand-grid{ grid-template-columns:1fr; } }
</style>
</body>
</html>
